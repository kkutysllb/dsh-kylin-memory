name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm check        # typecheck + vitest + esbuild
      - run: pnpm smoke        # 发布面契约（双 manifest、静态 patch、零 @deepseek-ai/* 导入）
      - run: pnpm verify:package
